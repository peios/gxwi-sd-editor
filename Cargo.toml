[package]
name = "gxwi-sd-editor"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

# The library is what a program that opens the editor needs: the protocol and
# a way to start it. It has nothing of GXWI's in it, so a program depending
# on it with `default-features = false` gets nothing of the editor's.
[lib]
path = "src/lib.rs"

[[bin]]
name = "gxwi-sd-editor"
path = "src/main.rs"
required-features = ["program"]

[features]
default = ["program"]
program = ["names", "dep:libgxwi", "dep:libc"]
# Who a SID is, as the editor says it, for a program that shows who a
# descriptor grants before the editor is opened.
names = ["dep:peios", "dep:libauthd"]
# What applying the parts of a descriptor the person changed comes to,
# for a program that keeps a descriptor whole, as a registry value.
splice = ["dep:peios"]
# A registry key's rights in words, and the editor opened on a key's own
# descriptor, for a program that shows registry keys.
registry = ["dep:peios"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The dialog role is not in a released libgxwi yet: until it is, the one
# beside this checkout.
libgxwi = { path = "../gxwi/libgxwi", optional = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "3cf23f68d40c4adff252e28241bb3c958fba824f", package = "peios", optional = true }
libauthd = { git = "https://github.com/peios/authd.git", rev = "ecd0cdd8fb1b0c82376750ab1a248dc82534a03e", package = "libauthd", optional = true }
libc = { version = "0.2", optional = true }
